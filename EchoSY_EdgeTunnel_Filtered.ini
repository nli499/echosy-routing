[custom]
; EchoSY EdgeTunnel 2.1 | based on cmliu ACL4SSR_Online_Mini_NoAuto_CF.ini
; Retains all 5 original groups; adds AI-Home + Fast-Download, both MANUAL select.
; AI-Home selects a node you choose manually. EdgeTunnel itself may not be residential egress.
; For Clash/Mihomo converted subscription. Test conversion before replacing working profile.
; Rules are FIRST MATCH. Common shared domains may need further connection-log tuning.

; Route AI, account sign-in and payment domains through residential nodes first.
ruleset=🏠 AI家宽,https://raw.githubusercontent.com/nli499/echosy-routing/refs/heads/main/rules/Residential-Preferred.list

; Original foundational + advertising rules (same URLs)
ruleset=🚀 节点选择,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/PlayStore.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset=🛑 全球拦截,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/adobe.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/GoogleCN.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/SteamCN.list

; Original China domain/IP exceptions before download host rules
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list

; Explicit international download hosts (domain only; no process-wide hijack)
ruleset=📦 高速下载,https://raw.githubusercontent.com/nli499/echosy-routing/refs/heads/main/rules/Fast-Download.list

; Keep remaining original rules, CDN and default final
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Telegram.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyMedia.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyLite.list
ruleset=☁️ CloudFlareCDN,https://raw.githubusercontent.com/cmliu/ACL4SSR/main/Clash/CloudflareCIDR.list
;ruleset=🎯 全球直连,[]GEOIP,LAN
ruleset=🎯 全球直连,[]GEOIP,CN
ruleset=🐟 漏网之鱼,[]FINAL

; Keep the original group names and add Fast-Download as a manual option in Final.
custom_proxy_group=🚀 节点选择`select`[]DIRECT`.*
custom_proxy_group=🎯 全球直连`select`[]DIRECT`[]🚀 节点选择
custom_proxy_group=🛑 全球拦截`select`[]REJECT`[]DIRECT
custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]🎯 全球直连`[]📦 高速下载`.*
custom_proxy_group=☁️ CloudFlareCDN`select`[]🐟 漏网之鱼`[]🚀 节点选择`[]🎯 全球直连`.*
; Select nodes by the keywords 家宽 and 优选 in their names.
custom_proxy_group=🏠 AI家宽`select`.*家宽.*
custom_proxy_group=📦 高速下载`select`.*优选.*

enable_rule_generator=true
overwrite_original_rules=true
